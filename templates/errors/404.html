{% extends "base.html" %}

{% block title %}404 Not Found — Smart Task Manager{% endblock %}

{% block content %}
<div class="row justify-content-center text-center py-5">
    <div class="col-12 col-md-6">
        <div class="card shadow-sm border-0 p-5 bg-white">
            <div class="text-secondary mb-3">
                <i class="bi bi-question-circle-fill display-1"></i>
            </div>
            <h1 class="fw-bold mb-2">404 Page Not Found</h1>
            <p class="text-muted mb-4">The task, project, or page you were searching for does not exist or may have been moved.</p>
            <div>
                <a href="{% url 'dashboard:index' %}" class="btn btn-primary px-4 shadow-sm">
                    <i class="bi bi-house-door me-1"></i> Return to Dashboard
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

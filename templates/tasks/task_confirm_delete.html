{% extends "base.html" %}

{% block title %}Delete Task — Smart Task Manager{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-6">
        <div class="card shadow border-danger p-4 p-md-5 text-center">
            <div class="text-danger mb-3">
                <i class="bi bi-trash3-fill fs-1"></i>
            </div>
            <h3 class="fw-bold mb-2">Delete Task?</h3>
            <p class="text-muted mb-4">
                Are you sure you want to permanently delete task <strong>"{{ task.title }}"</strong> from project <em>{{ task.project.title }}</em>?
            </p>

            <form method="post">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-3">
                    <a href="{{ task.get_absolute_url }}" class="btn btn-light border px-4">Cancel</a>
                    <button type="submit" class="btn btn-danger px-4 shadow-sm">
                        <i class="bi bi-trash me-1"></i> Confirm Delete
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
